
name: SSH Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Start SSH session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15
